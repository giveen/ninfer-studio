[package]
name = "ninfier-studio"
version = "0.3.4"
edition = "2024"
description = "NInfer Studio — native Linux desktop shell (Tauri 2) hosting the NInfer control plane + web UI."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Enabled for the packaged build (needs libappindicator3-dev on Linux).
tray = ["tauri/tray-icon"]

[lints]
workspace = true

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
ninfier-control.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "fs", "io-util"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = "0.1"
