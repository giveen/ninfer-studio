[package]
name = "ninfier-control"
version = "0.3.19"
edition = "2024"
description = "NInfer Studio control plane: engine process supervision, model management, GPU stats, SSE-safe engine API proxy, static hosting. Framework-agnostic (no Tauri imports)."

[lints]
workspace = true

[dependencies]
# `process` is explicit: the sandbox layer (src/sandbox/mod.rs) names
# `tokio::process::*` on every target — don't rely on `full`'s composition.
tokio = { workspace = true, features = ["full", "process"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = "0.1"
base64 = "0.23"
reqwest = { version = "0.13", features = ["stream", "json", "default-tls"], default-features = false }
ignore = "0.4"
globset = "0.4"
# SSE frame bytes for the agent run event stream (axum re-exports it, but
# naming it directly keeps the run module free of `axum::body` noise).
bytes = "1"
# Embedded headless browser for the coder `browser` tool. Pinned to a rev:
# the `obscura` name on crates.io belongs to an unrelated 0.0.2 raytracer, so
# this is a git dependency. Re-pin deliberately when upgrading; `render`
# (screenshots/PDF) is intentionally NOT enabled — it forces workspace-level
# [patch.crates-io] entries for vendored taffy/cosmic-text that we don't
# want to mirror, and the agent tool only needs DOM + JS + Markdown.
obscura-browser = { git = "https://github.com/h4ckf0r0day/obscura", rev = "edb67cd95099ba40bf7b0c3f394e0f8e9e62ddf1" }
scraper = "0.27"
regex = "1.10"
futures-util = "0.3"
dirs = "7"
# Official Rust MCP SDK (modelcontextprotocol/rust-sdk) — client side only:
# stdio child-process transport + streamable-HTTP client. `default-features =
# false` skips the server/macro half we never use; its reqwest (0.13.x)
# unifies with the one above, so no duplicate TLS stack.
rmcp = { version = "3.3", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
diffy = "0.3"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
petgraph = "0.6"
parking_lot = "0.12"

# Windows-only: the coder sandbox runs the shell at low integrity inside a
# Job Object (see src/sandbox/windows.rs). Target-scoped so Linux builds
# never pay for it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Console",
] }
