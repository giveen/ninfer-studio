[package]
name = "ninfier-control"
version = "0.3.3"
edition = "2024"
description = "NInfer Studio control plane: engine process supervision, model management, GPU stats, SSE-safe engine API proxy, static hosting. Framework-agnostic (no Tauri imports)."

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = "0.1"
base64 = "0.23"
reqwest = { version = "0.13", features = ["stream", "json", "rustls"], default-features = false }
ignore = "0.4"
globset = "0.4"
scraper = "0.27"
regex = "1.10"
futures-util = "0.3"
dirs = "7"
