name: Release

# Builds NInfer Studio for Linux (.deb + .AppImage) and Windows (.exe/nsis), and
# attaches each artifact to a single GitHub Release.
#
# Trigger by pushing a tag `v*`, or run manually from the Actions tab.
# macOS is intentionally omitted (no GPU/engine use case there).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + bundle on each platform, uploading into the draft release.
  #
  # Gated behind the `release` environment: tags still fire this workflow the
  # moment they're pushed, but each matrix job pauses at "Waiting" until a
  # required reviewer approves it in the Actions tab. Without this, every tag
  # push — including ones cut per-commit during active development — burns a
  # full Linux + Windows installer build (~30 billed minutes) unconditionally.
  # Configure the required reviewers once in Settings > Environments >
  # release; this file alone doesn't enforce approval on its own.
  build:
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: '--features tray --bundles deb appimage'
          - os: windows-latest
            args: '--features tray --bundles nsis'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4        # reads packageManager from package.json

      - name: Set Windows CFLAGS for aws-lc-sys C11 atomics
        if: matrix.os == 'windows-latest'
        run: echo "CFLAGS=/std:c11 /experimental:c11atomics" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Linux needs the Tauri/WebKit/ayatana dev headers & mold linker.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold clang \
            libwebkit2gtk-4.1-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
          echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> $GITHUB_ENV

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (apps/web -> dist)
        run: pnpm build

      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          tagName: v__VERSION__
          releaseName: 'NInfer Studio v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
