name: Release

# Builds NInfer Studio for Linux (.deb + .AppImage), Windows (.exe/nsis),
# and macOS (.dmg) and attaches each artifact to a single GitHub Release.
#
# Trigger by pushing a tag `v*`, or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Create one draft release up-front so every matrix job can append to it.
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `NInfer Studio ${tag}`,
              draft: true,
              prerelease: false,
            });
            core.setOutput('id', data.id);

  # 2. Build + bundle on each platform, uploading into the draft release.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: '--features tray --bundles deb appimage'
          - os: windows-latest
            args: '--features tray --bundles nsis'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4        # reads packageManager from package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Linux needs the Tauri/WebKit/ayatana dev headers.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (apps/web -> dist)
        run: pnpm build

      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
