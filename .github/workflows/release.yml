name: Release

# Builds NInfer Studio for Linux (.deb + .AppImage) and Windows (.exe/nsis), and
# attaches each artifact to a single GitHub Release.
#
# Trigger by pushing a tag `v*`, or run manually from the Actions tab.
# macOS is intentionally omitted (no GPU/engine use case there).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Create one draft release up-front so every matrix job can append to it.
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Create draft release
        id: create
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `NInfer Studio ${tag}`,
              draft: true,
              prerelease: false,
            });
            core.setOutput('id', data.id);

  # 2. Build + bundle on each platform, uploading into the draft release.
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: '--features tray --bundles deb appimage'
          - os: windows-latest
            args: '--features tray --bundles nsis'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4        # reads packageManager from package.json

      - name: Set Windows CFLAGS for aws-lc-sys C11 atomics
        if: matrix.os == 'windows-latest'
        run: echo "CFLAGS=/std:c11 /experimental:c11atomics" >> $env:GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Linux needs the Tauri/WebKit/ayatana dev headers.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
          # Install linuxdeploy and related tools for appimage bundling
          wget -O AppRun https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          chmod +x AppRun
          sudo mv AppRun /usr/local/bin/AppRun
          wget -O linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
          wget -O linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-plugin-gtk.sh
          sudo mv linuxdeploy-plugin-gtk.sh /usr/local/bin/linuxdeploy-plugin-gtk.sh
          wget -O linuxdeploy-plugin-gstreamer.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy-plugin-gstreamer.sh
          sudo mv linuxdeploy-plugin-gstreamer.sh /usr/local/bin/linuxdeploy-plugin-gstreamer.sh
          wget -O linuxdeploy-plugin-appimage.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-plugin-appimage.AppImage
          sudo mv linuxdeploy-plugin-appimage.AppImage /usr/local/bin/linuxdeploy-plugin-appimage

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (apps/web -> dist)
        run: pnpm build

      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
