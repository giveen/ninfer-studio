name: CI / Web

# Type-check + production build of the React app, plus the API-surface
# registration gate (every /api/* path the UI calls must be registered by
# the Rust control plane). Runs on pull requests that touch the web app or
# the control-plane router (including forks) and on direct pushes to main,
# so the lockfile and TS surfaces can't silently drift.

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'desktop/control/src/lib.rs'
      - 'scripts/api-parity.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-web.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'desktop/control/src/lib.rs'
      - 'scripts/api-parity.mjs'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: tsc + vite build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check + build (apps/web)
        run: pnpm --filter @ninfier/web build
      - name: API surface registration (UI endpoints vs control plane)
        run: node scripts/api-parity.mjs
