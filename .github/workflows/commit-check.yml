name: Commit Hygiene Check

on:
  push:
    branches: [main]

jobs:
  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check commit messages for auto-commit pattern
        run: |
          git log -1 --pretty=%B ${{ github.sha }} | grep -i "auto-commit:" && {
            echo "Found disallowed auto-commit pattern. Failing job."; exit 1;
          } || echo "Commit messages OK."
