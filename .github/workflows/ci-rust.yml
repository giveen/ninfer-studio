name: CI / Rust control

# Tests for the Rust control plane (desktop/control): every /api/* handler,
# the serve-arg builder fixture test, and the workspace/memory unit +
# concurrency suites, gated by `cargo clippy -D warnings`. Locked mode keeps
# Cargo.lock from drifting when Cargo.toml changes.
#
# No `cargo fmt --check` gate yet: the codebase predates a repo rustfmt.toml
# and doesn't conform to stock rustfmt output (import ordering, wrap width),
# so enabling it now would require a large, unrelated reformat-everything
# commit first.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'desktop/control/tests/parity/**'
      - '.github/workflows/ci-rust.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'desktop/control/tests/parity/**'
      - '.github/workflows/ci-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test (ninfier-control)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Clippy
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml -p ninfier-control -- -D warnings
      - name: Run control-plane tests
        run: cargo test --locked --manifest-path desktop/Cargo.toml -p ninfier-control

  windows-check:
    # The control plane ships on Windows too (NSIS release build) and its
    # coder sandbox is OS-specific (Job Object + low integrity, see
    # desktop/control/src/sandbox/windows.rs) — that code only ever
    # compiles for a Windows target, so the Linux job above never sees it.
    # This native check is what gates it (the release build is not a CI
    # gate).
    name: cargo check (ninfier-control, windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Set Windows CFLAGS for aws-lc-sys C11 atomics
        run: echo "CFLAGS=/std:c11" >> $env:GITHUB_ENV
      - name: Check control plane for Windows
        # --tests: the sandbox layer keeps its pure-logic unit tests (arg
        # quoting, env scrubbing, command-line shapes) in-crate; a plain
        # check would never typecheck them.
        run: cargo check --locked --tests --manifest-path desktop\Cargo.toml -p ninfier-control
